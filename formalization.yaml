    only.

fidelity:
  divergences: >-
    (1) Non-provability is proved for the first-order sentence Erdos1220 ("every singular
    cardinal λ with λ and cf λ ℵ₀-inaccessible satisfies λ → (λ, ℵ₁)²"), rendered inside
    erdos501's language ∅, ω, 𝒫, ⋃, (·,·), ∈; erdos1220_sentence_faithful certifies that in
    Mathlib's ZFSet it is equivalent to Erdos1220.Problem1220.{0}.  Inside the sentence,
    cardinality comparisons are injections, cardinals are initial ordinals, cofinality is the
    least size of a cofinal subset, μ^ℵ₀ < κ is "the set of functions ω → μ injects into some
    α ∈ κ", colourings are sets of ordered pairs (α, β) with α ∈ β ∈ λ.  (2) ZFC is erdos501's
    (Flypitch's) axiomatization, equivalent to the usual ZFC.  (3) Non-provability is stated
    semantically (Mathlib has no proof calculus): some model of ZFC with carrier in Type 0
    satisfies ¬Erdos1220 (by Löwenheim–Skolem no restriction).  (4) The witness is ℶ_{𝔠⁺} of
    the ground model, not ℵ_{𝔠⁺}; the chain condition is proved for θ = (2^μ)⁺ in ZFC (no GCH).
    (5) The result answers the question as posed ("does λ → (λ, ℵ₁)² hold?") in the sense
    "not provable in ZFC", the erdosproblems.com status category used e.g. for #474; the
    consistency of the affirmative answer (hence full independence) is not part of this
    formalization.

