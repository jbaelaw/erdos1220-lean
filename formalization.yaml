    relationship: builds-on
    note: >-
      dependency (Apache-2.0), pinned as the fork jbaelaw/flypitch4-lean at 78e1fd0 = upstream 218d1c1
      plus a minimal port to Lean v4.35.0-rc3 (renamed/removed lemmas only): its statement module Erdos501.FOL.Statement
      (language L, theory ZFC, formula combinators, zfsetStructure) is imported by the Challenge,
      so the target is stated for the same ZFC; its vendored Lean 4 Flypitch (Boolean-valued
      models, completeness theorem, regular-open algebras), its Mathlib-ModelTheory bridge and
      its Δ-system proof for 𝔠⁺ countable sets (generalized here to (2^μ)⁺ sets of size ≤ μ,
      Erdos1220/DeltaSystem.lean) are reused; its comparator tooling (scripts, pins) is adapted
  - id: "https://github.com/flypitch/flypitch"
    relationship: builds-on
    note: >-
      Han–van Doorn, "A formal proof of the independence of the continuum hypothesis" (CPP 2020);
      used through erdos501's vendored Lean 4 port (Flypitch4/, Ian Klatzco with Claude)
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: builds-on
    note: >-
      Mathlib.ModelTheory, ZFSet and cardinal arithmetic supply the trusted statements (pinned
