  msc2020: ["03E35", "03E02", "03E05", "03E40", "03E55"]

status:
  scope: >-
    The consistency of a negative answer to Erdős #1220, ¬ (ZFC ⊨ᵇ Erdos1220), and the
    faithfulness of the first-order rendering.  Complete for these two targets: no sorry in the
    import closure of Solution.lean.  The consistency of a positive answer (hence independence)
    is not claimed and not formalized.
  sorry_count: 0  # the two sorries of Challenge.lean are the comparator's trusted statements
  known_gaps: >-
    Mathematical scope: non-provability only (see fidelity).  The erdos501 dependency is used
    through a fork ported to Lean v4.35.0-rc3; only the modules in the import closure of the
    targets are claimed to build there.
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]
  main_results:
    - declaration: "erdos1220_not_provable"
      file: "Solution.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "comparator.json"
    - declaration: "erdos1220_sentence_faithful"
      file: "Solution.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "comparator.json"

