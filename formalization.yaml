# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4) — metadata for the Lean 4 formalization of Erdős Problem #1220.
# Modelled on elliotglazer/erdos501's formalization.yaml.  Palomar registry conventions
# (https://palomar-registry.org/how-to-submit) are followed.  NOT YET SUBMITTED.

version: "v0.4"

project:
  name: "Erdős Problem #1220 in Lean 4: the affirmative statement is not provable in ZFC"
  authors:
    - "Ji Ho Bae (JRTI)"
  responsible_maintainers:
    - "Ji Ho Bae"
  license: "Apache-2.0"
  description: >-
    Erdős problem #1220 (erdosproblems.com/1220; Erdős–Hajnal 1971): let λ be a singular cardinal
    such that both λ and cf(λ) are ℵ₀-inaccessible (μ^ℵ₀ < κ for all μ < κ); does
    λ → (λ, ℵ₁)² hold?  This formalization settles the question as asked on erdosproblems.com
    in the negative sense "not provable": ZFC does not prove that every such λ satisfies
    λ → (λ, ℵ₁)² (erdos1220_not_provable : ¬ (ZFC ⊨ᵇ Erdos1220)), i.e. there is a model of ZFC
    with a singular λ, λ and cf(λ) ℵ₀-inaccessible, and λ ↛ (λ, ℵ₁)².  Shelah and Stanley (Sh:258,
    Ann. Pure Appl. Logic 36 (1987)) showed that a negative answer is consistent with ZFC.  This
    project formalizes that consistency result: the comparator target
    erdos1220_not_provable : ¬ (ZFC ⊨ᵇ Erdos1220) is stated for literally the same first-order
    theory ZFC, language and ZFSet interpretation as elliotglazer/erdos501's comparator
    challenge (imported from its statement module Erdos501.FOL.Statement), together with a
    faithfulness theorem erdos1220_sentence_faithful: in Mathlib's ZFSet the sentence Erdos1220
    holds iff the Mathlib-level statement Erdos1220.Problem1220 holds.  The witness is the
    ground-model singular strong-limit cardinal λ = ℶ_{𝔠⁺} (cf λ = 𝔠⁺; λ and cf λ are
    ℵ₀-inaccessible without any deep cardinal-arithmetic input), not ℵ_{𝔠⁺}.  The forcing is the
    Shelah–Stanley §3 forcing, formalized as block-preserving, block-covering histories of basic
    conditions (weak extension order), with the μ⁺-strategic closure (hence μ-distributivity) and
    the (2^μ)⁺-chain condition proved in ZFC without GCH (Δ-system lemma for (2^μ)⁺ sets of size
    ≤ μ, blueprint counting (2^μ)^μ = 2^μ).  In the Boolean-valued model of its regular-open
    algebra (built with the Lean 4 port of Han–van Doorn's Flypitch vendored by erdos501) the
    hypotheses on λ are preserved, the generic colouring of [λ]² has neither a red homogeneous
    set of size λ nor a blue homogeneous set of size ℵ₁, and Flypitch's completeness theorem
    turns this into a two-valued model of ZFC satisfying ¬Erdos1220.  Both targets are proved
    from propext, Classical.choice and Quot.sound only and pass the Lean comparator.  Only the
    negative direction is claimed: independence (consistency of a positive answer) is NOT
    claimed.

sources:
  - title: "Unsolved problems in set theory"
    authors: ["Paul Erdős", "András Hajnal"]
    id: "Proc. Sympos. Pure Math. XIII, Part I (Axiomatic Set Theory), AMS 1971, 17–48"
    type: paper
    relationship: background
    author_endorsement: "n/a"
    note: "poses the problem; no result of this source is formalized"
  - title: "Erdős problem #1220 (erdosproblems.com)"
    authors: ["Thomas F. Bloom (ed.)"]
    id: "https://www.erdosproblems.com/1220"
    type: "web discussion"
    relationship: background
    author_endorsement: "not-contacted"
    note: >-
      the canonical modern statement; the Mathlib-level statement Erdos1220.Problem1220 (singular
      λ, λ and cf λ ℵ₀-inaccessible, binary arrow λ → (λ, ℵ₁)² on unordered pairs) follows it
  - title: "A theorem and some consistency results in partition calculus"
    authors: ["Saharon Shelah", "Lee J. Stanley"]
    id: "Ann. Pure Appl. Logic 36 (1987), 119–152 (Sh:258), doi:10.1016/0168-0072(87)90015-7"
    type: paper
    location: "§3 (the forcing: basic conditions, histories, amalgamation; §3.7–§3.9 chain condition and homogeneous sets)"
    relationship: adapts
    author_endorsement: "not-contacted"
    note: >-
      the consistency of a negative answer.  Formalized with these adaptations: the forcing is
      restricted to block-preserving, block-covering histories with a weak (flip-closed)
      extension order; the ground-model witness is the strong limit ℶ_{𝔠⁺}; the chain
      condition is proved for θ = (2^μ)⁺ in ZFC without GCH; the argument is carried out in
      Flypitch's Boolean-valued model rather than in a generic extension

