    c55e6e786f49471c72fbddbec5415808896aec1e.

alignment:
  namespace: "Erdos1220, Erdos1220.FOL, Erdos1220.Final, Erdos1220.DeltaSystem, Erdos1220.HistoryBlueprint, Erdos1220Full"
  statements:
    - source: "Shelah–Stanley 1987 (Sh:258), consistency of a negative answer"
      lean: "erdos1220_not_provable (Erdos1220.FOL.erdos1220_not_provable ← not_provable_of_names (check X) cdot₁ hyp₁ colouring₁ arrow₁)"
      module: "Solution.lean (Erdos1220Full/Independence1220.lean, Assembly1220.lean, Bridge1220.lean)"
      status: proved
    - source: "Faithfulness of the first-order rendering (erdosproblems.com statement)"
      lean: "erdos1220_sentence_faithful (Erdos1220.FOL.erdos1220_sentence_faithful)"
      module: "Solution.lean (Erdos1220Full/Faithful1220.lean)"
      status: proved
    - source: "Sh:258 §3: hypotheses on λ preserved"
      lean: "Erdos1220.Final.hyp₁"
      module: "Erdos1220Full/CofInstance1220.lean, HypInstance1220.lean"
      status: proved
    - source: "Sh:258 §3.9: no red homogeneous set of size λ"
      lean: "Erdos1220.Final.red₁ (Erdos1220Full.RedExclusion.red_exclusion, Erdos1220.BPHistory.red_core)"
      module: "Erdos1220Full/Red1220.lean, RedExclusion.lean, Erdos1220/RedCore.lean"
      status: proved
    - source: "Sh:258 §3.7: no blue homogeneous set of size ℵ₁"
      lean: "Erdos1220.Final.blue₁"
      module: "Erdos1220Full/BlueFinal1220.lean"
      status: proved
    - source: "Sh:258 §3.8: (2^μ)⁺-chain condition"
      lean: "Erdos1220Full.RedExclusion.antichain_CHP, Erdos1220Full.antichainBound_HP (Erdos1220.HistoryBlueprint.cc_histories)"
      module: "Erdos1220Full/RedExclusion.lean, AntichainHP.lean, Erdos1220/HistoryBlueprint.lean, Erdos1220/DeltaSystem.lean"
      status: proved

